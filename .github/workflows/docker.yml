name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const p = require('./package.json'); if ('v' + p.version !== process.env.GITHUB_REF_NAME) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json ' + p.version); process.exit(1) }"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=塔台 Tower Web
            org.opencontainers.image.description=本地优先的代理订阅管理、测速与多客户端配置导出
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: "${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}"
          push: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          {
            echo "## Docker 镜像"
            echo
            echo "支持 linux/amd64 和 linux/arm64，镜像 digest：\`${{ steps.build.outputs.digest }}\`。"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE_NAME}:${TAG}"
            echo "docker pull ${IMAGE_NAME}:latest"
            echo '```'
            echo
            echo "运行（数据保存在 \`/app/data\`，请保留数据卷）："
            echo
            echo '```bash'
            echo "docker run -d --name tower-web -p 8787:8787 -v tower-data:/app/data ${IMAGE_NAME}:${TAG}"
            echo '```'
            echo
            echo "打开 <http://127.0.0.1:8787>。容器默认监听 \`0.0.0.0:8787\`，没有鉴权，只建议在可信网络使用。"
            echo
            echo "也可以直接使用仓库根目录的 \`docker-compose.yml\`（已作为附件上传）。"
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docker-compose.yml --clobber
          else
            gh release create "$TAG" \
              --title "塔台 Tower Web $TAG" \
              --generate-notes \
              --notes "$(cat release-notes.md)" \
              docker-compose.yml
          fi
