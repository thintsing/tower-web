services:
  tower-web:
    image: ${TOWER_IMAGE:-ghcr.io/thintsing/tower-web:latest}
    container_name: tower-web
    restart: unless-stopped
    ports:
      # 默认暴露到局域网，方便手机直连。若本机已有 cloudflared / frp 等隧道，
      # 建议只绑回环： "127.0.0.1:8787:8787"，无需再对局域网开放 8787。
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      # 可选的初始化管理密钥。容器内无法可靠区分「宿主机浏览器」和伪造
      # Host 的局域网客户端；未设置密钥时，设置页不能从宿主机创建首个密钥。
      # 服务器模式允许 1–128 个非空白字符，但请直接用 ≥32 位随机值：
      #   openssl rand -hex 32
      # TOWER_API_TOKEN: change-me-with-at-least-32-random-chars
      # 从宿主机本机打开页面、又要复制给手机时，填宿主机的局域网地址；
      # 容器内网卡地址默认对手机不可达。
      # TOWER_PUBLIC_URL: http://192.168.1.10:8787
    volumes:
      # 已发布订阅保存在这里；删除卷会让客户端已保存的订阅链接失效。
      - tower-data:/app/data
      # 改用宿主机目录（bind mount）时注意属主：目录由 root 创建时，容器内的
      # node(UID 1000) 写不进去，服务器模式工作区会一直为空，健康检查显示
      # unhealthy。修复任选其一：
      #   1) sudo chown -R 1000:1000 <挂载目录>
      #   2) 给本服务加 user: "root"，entrypoint 启动时会 chown 后降权到 node。
      # - /opt/tower/app/data:/app/data

volumes:
  tower-data:
